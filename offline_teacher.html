<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Offline Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Arial, sans-serif; background: #f5f6fa; color: #2c3e50; padding: 20px; }
  .container { max-width: 1000px; margin: auto; }
  h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-bottom: 20px; }
  h2 { margin: 20px 0 10px; color: #34495e; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 10px 20px; background: #ddd; border: none; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 14px; font-weight: 600; }
  .tab.active { background: #3498db; color: #fff; }
  .tab-content { display: none; background: #fff; padding: 20px; border-radius: 0 6px 6px 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .tab-content.active { display: block; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  select, input[type=range] { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .slider-row label { flex: 1; margin: 0; font-weight: normal; }
  .slider-row input { flex: 2; }
  .slider-row span { width: 40px; text-align: right; font-weight: 600; }
  .tier-box { border-radius: 8px; padding: 15px; margin: 10px 0; }
  .tier-remediation { background: #fdecec; border-left: 5px solid #e74c3c; }
  .tier-on_track { background: #fef9e7; border-left: 5px solid #f1c40f; }
  .tier-ahead { background: #e8f8f5; border-left: 5px solid #27ae60; }
  .tier-box h3 { margin-bottom: 8px; }
  .tier-box table { width: 100%; border-collapse: collapse; }
  .tier-box td, .tier-box th { padding: 6px 8px; text-align: left; border-bottom: 1px solid #ddd; }
  .tier-box th { font-weight: 600; color: #555; font-size: 13px; }
  .btn { background: #3498db; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
  .btn:hover { background: #2980b9; }
  .btn-green { background: #27ae60; }
  .btn-green:hover { background: #219a52; }
  .stats { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px 20px; flex: 1; min-width: 120px; text-align: center; }
  .stat-card .num { font-size: 28px; font-weight: 700; color: #3498db; }
  .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }
  .print-area { padding: 10px; }
  @media print { body { background: #fff; padding: 0; } .tab { display: none; } .tab-content { display: block !important; } .btn { display: none; } }
</style>
</head>
<body>
<div class="container">
<h1>📋 Teacher Offline Tool</h1>
<p id="status">Loading data...</p>

<div class="tabs" id="tabs">
  <button class="tab active" onclick="switchTab('input')">📝 Enter Scores</button>
  <button class="tab" onclick="switchTab('triage')">📊 Triage Groups</button>
  <button class="tab" onclick="switchTab('report')">🖨️ Printable Report</button>
</div>

<div id="tab-input" class="tab-content active">
  <h2>Step 1: Pick Subject</h2>
  <select id="subject-select" onchange="renderInputForm()"></select>

  <div id="score-form"></div>

  <button class="btn btn-green" onclick="submitScores()">📥 Submit Scores & Run Triage</button>
  <p id="submit-msg" style="margin-top:8px;font-weight:600;"></p>
</div>

<div id="tab-triage" class="tab-content">
  <h2>Class Triage</h2>
  <select id="triage-subject" onchange="runTriage()"></select>
  <div id="triage-results"></div>
</div>

<div id="tab-report" class="tab-content">
  <h2>Printable Report</h2>
  <select id="report-subject" onchange="generateReport()"></select>
  <div id="report-results" class="print-area"></div>
  <button class="btn" onclick="window.print()" style="margin-top:15px;">🖨️ Print Report</button>
</div>
</div>

// ======================== HELPERS ========================
function predictGrade(studentId, subject) {
  var s = DATA.students.find(function(st) { return st.id === studentId; });
  if (!s) return 0.5;
  var initial = 0.5;
  if (s.grade_history[subject] && s.grade_history[subject].length > 0) {
    initial = s.grade_history[subject][0];
  }
  var total = initial;
  return Math.min(Math.max(total, 0), 1);
}

function triage(subject) {
  var results = DATA.students.map(function(s) {
    var pred = predictGrade(s.id, subject);
    return { student_id: s.id, name: s.name, predicted: pred };
  });
  results.sort(function(a,b) { return a.predicted - b.predicted; });
  var lo = results[Math.floor(results.length / 3)].predicted;
  var hi = results[Math.floor(2 * results.length / 3)].predicted;
  var tiers = { remediation: [], on_track: [], ahead: [] };
  var tierKeys = ['remediation', 'on_track', 'ahead'];
  var tierDiff = { remediation: 1, on_track: 3, ahead: 5 };
  var tierNotes = {
    remediation: 'Needs extra practice — recommend foundational materials',
    on_track: 'On track — recommend standard curriculum materials',
    ahead: 'Ahead of class — recommend advanced/challenge materials'
  };
  results.forEach(function(r) {
    var t;
    if (r.predicted <= lo) t = 'remediation';
    else if (r.predicted <= hi) t = 'on_track';
    else t = 'ahead';
    tiers[t].push(r);
  });
  return { subject: subject, total: results.length, tiers: tiers, diff: tierDiff, notes: tierNotes };
}

function tierHtml(tierName, tierData, diff, note) {
  var colors = { remediation: '#e74c3c', on_track: '#f1c40f', ahead: '#27ae60' };
  var icons = { remediation: '🔴', on_track: '🟡', ahead: '🟢' };
  var label = tierName.charAt(0).toUpperCase() + tierName.slice(1).replace('_',' ');
  var html = '<div class="tier-box tier-' + tierName + '">';
  html += '<h3>' + icons[tierName] + ' ' + label + ' (' + tierData.length + ' students)</h3>';
  html += '<p style="font-size:13px;color:#666;margin-bottom:8px;"><em>Difficulty ' + diff + '/5 — ' + note + '</em></p>';
  if (tierData.length > 0) {
    html += '<table><tr><th>Student</th><th>Predicted Score</th></tr>';
    tierData.forEach(function(s) {
      html += '<tr><td>' + s.name + '</td><td>' + s.predicted.toFixed(2) + '</td></tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  return html;
}

// ======================== TABS ========================
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  var btns = document.querySelectorAll('.tab');
  var idx = ['input','triage','report'].indexOf(name);
  if (btns[idx]) btns[idx].classList.add('active');
}

// ======================== INPUT TAB ========================
function populateSubjectSelects() {
  var subs = DATA.subjects;
  ['subject-select', 'triage-subject', 'report-subject'].forEach(function(id) {
    var sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '';
    subs.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      sel.appendChild(opt);
    });
  });
}

function renderInputForm() {
  var subject = document.getElementById('subject-select').value;
  var form = document.getElementById('score-form');
  form.innerHTML = '<h3>Enter scores for ' + subject + '</h3>';
  DATA.students.forEach(function(s) {
    var defaultVal = s.performance;
    var latest = s.grade_history[subject];
    if (latest && latest.length > 0) defaultVal = latest[latest.length - 1];
    var div = document.createElement('div');
    div.className = 'slider-row';
    div.innerHTML = '<label>' + s.name + '</label>' +
      '<input type="range" min="0" max="1" step="0.05" value="' + defaultVal + '" id="score-' + s.id + '" oninput="document.getElementById(\'val-' + s.id + '\').textContent=parseFloat(this.value).toFixed(2)">' +
      '<span id="val-' + s.id + '">' + defaultVal.toFixed(2) + '</span>';
    form.appendChild(div);
  });
}

function submitScores() {
  var subject = document.getElementById('subject-select').value;
  DATA.students.forEach(function(s) {
    var inp = document.getElementById('score-' + s.id);
    if (!inp) return;
    var score = parseFloat(inp.value);
    if (!s.grade_history[subject]) s.grade_history[subject] = [];
    s.grade_history[subject].push(score);
    s.performance = (s.performance + score) / 2;
  });
  document.getElementById('submit-msg').textContent = '✅ Scores saved! Switch to Triage Groups tab.';
  var sel = document.getElementById('triage-subject');
  if (sel) { sel.value = subject; runTriage(); }
}

// ======================== TRIAGE TAB ========================
function runTriage() {
  var subject = document.getElementById('triage-subject').value;
  var result = triage(subject);
  var container = document.getElementById('triage-results');
  var html = '<div class="stats"><div class="stat-card"><div class="num">' + result.total + '</div><div class="label">Students</div></div></div>';
  html += tierHtml('remediation', result.tiers.remediation, result.diff.remediation, result.notes.remediation);
  html += tierHtml('on_track', result.tiers.on_track, result.diff.on_track, result.notes.on_track);
  html += tierHtml('ahead', result.tiers.ahead, result.diff.ahead, result.notes.ahead);
  container.innerHTML = html;
}

// ======================== REPORT TAB ========================
function generateReport() {
  var subject = document.getElementById('report-subject').value;
  var result = triage(subject);
  var now = new Date().toLocaleString();
  var html = '<h2 style="border-bottom:2px solid #3498db;padding-bottom:8px;">Class Report — ' + subject + '</h2>';
  html += '<p>Total students: ' + result.total + ' | Generated: ' + now + '</p>';
  html += tierHtml('remediation', result.tiers.remediation, result.diff.remediation, result.notes.remediation);
  html += tierHtml('on_track', result.tiers.on_track, result.diff.on_track, result.notes.on_track);
  html += tierHtml('ahead', result.tiers.ahead, result.diff.ahead, result.notes.ahead);
  document.getElementById('report-results').innerHTML = html;
}

// ======================== INIT ========================
document.getElementById('status').textContent = '✓ Loaded ' + DATA.students.length + ' students, ' + DATA.subjects.length + ' subjects.';
populateSubjectSelects();
renderInputForm();
runTriage();
generateReport();
</script>
